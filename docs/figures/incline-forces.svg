<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" width="260" height="160"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#191b1d"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3f6b4f"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8d3b34"/>
    </marker>
    <marker id="axis" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#62686d"/>
    </marker>
  </defs>

  <!-- наклонная плоскость -->
  <path d="M44 132 L216 132 L216 46 Z" fill="#eef0ec" stroke="#191b1d" stroke-width="1.2"/>
  <line x1="12" y1="132" x2="252" y2="132" stroke="#b6bcb5" stroke-width="1"/>

  <!-- угол -->
  <path d="M76 132 A32 32 0 0 0 72.6 117.7" fill="none" stroke="#62686d" stroke-width="0.9"/>
  <text x="80" y="127" font-size="12" fill="#62686d">α</text>

  <!-- оси -->
  <line x1="44" y1="132" x2="26.1" y2="96.2" stroke="#62686d" stroke-width="1" marker-end="url(#axis)"/>
  <text x="21" y="93" font-size="10" fill="#62686d" text-anchor="end">y</text>
  <line x1="40.4" y1="124.8" x2="79.7" y2="105.1" stroke="#62686d" stroke-width="1" marker-end="url(#axis)"/>
  <text x="83" y="102" font-size="10" fill="#62686d">x</text>

  <!-- брусок -->
  <g transform="translate(128.9 78.4) rotate(-26.57)">
    <rect x="-20" y="-10" width="40" height="20" rx="2" fill="#f7f7f4" stroke="#191b1d" stroke-width="1.2"/>
  </g>

  <!-- силы -->
  <line x1="128.9" y1="78.4" x2="128.9" y2="116.4" stroke="#191b1d" stroke-width="1.4" marker-end="url(#ink)"/>
  <text x="134" y="124" font-size="11" fill="#191b1d">mg</text>

  <line x1="128.9" y1="78.4" x2="113.7" y2="48.0" stroke="#3f6b4f" stroke-width="1.4" marker-end="url(#green)"/>
  <text x="109" y="44" font-size="11" fill="#3f6b4f" text-anchor="end">N</text>

  <line x1="128.9" y1="78.4" x2="159.3" y2="63.2" stroke="#8d3b34" stroke-width="1.4" marker-end="url(#red)"/>
  <text x="163" y="58" font-size="11" fill="#8d3b34">F<tspan font-size="8" dy="3">тр</tspan></text>
</svg>
